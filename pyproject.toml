[project]
name = "alphafold3_input"
version = "0.3.3"
description = "AlphaFold 3 input schema models."
authors = [
    { name = "Igor Koop" },
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "rdkit>=2026.3.3",
]
keywords = [
    "alphafold3",
    "pydantic",
    "bioinformatics",
    "job-definition",
    "input-generation",
    "json",
    "json-schema",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/igor-koop/alphafold3_input"
Documentation = "https://igor-koop.github.io/alphafold3_input/"
Changelog = "https://github.com/igor-koop/alphafold3_input/releases"
Issues = "https://github.com/igor-koop/alphafold3_input/issues"

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "alphafold3_input"

[dependency-groups]
dev = [
    "furo>=2025.12.19",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.16",
    "sphinx>=9.1.0",
    "sphinx-autobuild>=2025.8.25",
    "ty>=0.0.46",
]

[tool.ruff]
line-length = 80
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
fixable = ["ALL"]
ignore = ["COM812"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"


[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D100", "PLR2004", "S101"]
"docs/**/*.py" = ["A001", "B010", "FBT001", "FBT002", "INP001", "PLR0913"]
"src/**/*.py" = ["ANN401", "TC001", "TC002", "TC003"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=alphafold3_input",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
source = ["alphafold3_input"]

[tool.coverage.report]
show_missing = true
skip_empty = true
